# ========================================================
# MCForge - Hospedagem 100% Automática no GitHub Actions
# 🌐 Roda no IP do GitHub (Nuvem) — NÃO usa seu IP nem Localhost
# ⚡ Baixa e instala tudo sozinho (Java 21, Node, Cloudflared, Playit, Paper)
# 💾 Salva o mundo automaticamente sem perder progresso
# 🛡️ Totalmente isolado (sem interferir em ninguém)
# ========================================================

name: 🚀 MCForge All-in-One (Servidor + Painel Web)

on:
  schedule:
    # Renovação automática para manter 24/7 (a cada 5h25min antes do limite de 6h do GitHub)
    - cron: '0 */5 * * *'
    - cron: '25 1,6,11,16,21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do Minecraft (ex: 1.21.1, 1.20.4)'
        required: true
        default: '1.21.1'
      server_type:
        description: 'Tipo de servidor'
        required: true
        default: 'paper'
        type: choice
        options:
          - paper
          - purpur
          - vanilla
      ram:
        description: 'Memória RAM alocada para o Minecraft'
        required: true
        default: '4G'
        type: choice
        options:
          - '3G'
          - '4G'
          - '5G'
          - '6G'

permissions:
  contents: write

jobs:
  mcforge-host:
    name: 🎮 Hospedagem MCForge na Nuvem GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 5h40min de execução contínua
    env:
      MC_VERSION: ${{ inputs.version || '1.21.1' }}
      MC_TYPE: ${{ inputs.server_type || 'paper' }}
      MC_RAM: ${{ inputs.ram || '4G' }}
      DAEMON_PORT: 3000

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java 21 (Automático na Nuvem)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🟢 Configurar Node.js 20 (Automático na Nuvem)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            daemon/package-lock.json
            panel/package-lock.json

      - name: 📦 Instalar Dependências e Compilar Painel Web
        run: |
          echo "📦 Instalando dependências do Daemon..."
          cd daemon && npm install
          cd ..

          echo "🎨 Compilando o Painel Web (Frontend)..."
          cd panel && npm install && npm run build
          cd ..
          echo "✓ Painel Web compilado em panel/dist!"

      - name: 💾 Restaurar Mundos e Dados Salvos
        run: |
          mkdir -p daemon/servers daemon/data backups
          if [ -f "backups/world-saved.tar.gz" ]; then
            echo "🎮 Backup do mundo encontrado! Restaurando..."
            tar -xzf backups/world-saved.tar.gz -C daemon/servers/
            echo "✓ Mundo restaurado com sucesso!"
          else
            echo "ℹ️ Nenhum mundo anterior. O servidor criará um novo automaticamente na nuvem."
          fi

          if [ -f "backups/data-saved.tar.gz" ]; then
            echo "🔑 Restaurando configurações..."
            tar -xzf backups/data-saved.tar.gz -C daemon/data/
          fi

          if [ -f "backups/playit-saved.tar.gz" ]; then
            echo "🌐 Restaurando IP Permanente do Playit.gg..."
            mkdir -p "$HOME/.config/playit"
            tar -xzf backups/playit-saved.tar.gz -C "$HOME/.config/playit"
            echo "✓ IP Permanente restaurado!"
          fi

      - name: 🌐 Instalar Ferramentas de Conexão (Playit.gg & Ferramentas Nativas)
        run: |
          mkdir -p logs

          # Instalar Playit.gg para o IP Público do Minecraft (TCP)
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq playit || echo "Playit via repo falhou, usando binário direto..."
          
          if ! command -v playit &>/dev/null; then
            curl -sL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
            chmod +x playit
            sudo mv playit /usr/local/bin/playit
          fi
          echo "✓ Ferramentas de rede na nuvem instaladas."

      - name: 🚀 Iniciar MCForge All-in-One (Nuvem GitHub)
        run: |
          cd daemon
          npm start > daemon.log 2>&1 &
          echo $! > ../daemon.pid
          cd ..
          echo "Aguardando boot do MCForge no servidor do GitHub..."
          sleep 6

      - name: 🔗 Publicar Links de Acesso (IP do GitHub / Nuvem)
        run: |
          mkdir -p logs
          
          # Inicia túnel seguro sem Cloudflare (Pinggy / SSH direto) para o Painel Web (porta 3000)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3000 a.pinggy.io > logs/panel-tunnel.log 2>&1 &
          echo $! > panel-tunnel.pid

          # Inicia playit em segundo plano para o IP de conexão do jogo
          playit --secret "${{ secrets.PLAYIT_SECRET }}" > logs/playit.log 2>&1 &
          echo $! > playit.pid

          # Aguarda conexões
          sleep 12

          PANEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.a\.pinggy\.link|https://[a-zA-Z0-9-]+\.pinggy\.link' logs/panel-tunnel.log | head -1)
          if [ -z "$PANEL_URL" ]; then
            # Fallback para localtunnel se pinggy demorar
            npx -y localtunnel --port 3000 > logs/localtunnel.log 2>&1 &
            sleep 6
            PANEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.loca\.lt' logs/localtunnel.log | head -1)
          fi
          
          # Extrai endereço do Playit para o Minecraft
          PLAYIT_ADDR=$(grep -oP '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|craft\.playit\.gg:\d+|playit\.gg)' logs/playit.log | head -1)
          PLAYIT_CLAIM=$(grep -oP 'https://playit\.gg/claim/[a-zA-Z0-9]+' logs/playit.log | head -1)
          
          # Obter IP original da máquina alocada do GitHub
          RUNNER_IP=$(curl -s --max-time 5 https://api.ipify.org || curl -s --max-time 5 https://icanhazip.com || curl -s --max-time 5 https://ifconfig.me || echo "")
          
          MINECRAFT_IP="${PLAYIT_ADDR:-$RUNNER_IP:25565}"
          if [ -z "$MINECRAFT_IP" ] || [ "$MINECRAFT_IP" = ":25565" ]; then
            MINECRAFT_IP="${PLAYIT_CLAIM:-playit.gg}"
          fi

          echo "PANEL_URL=$PANEL_URL" >> $GITHUB_ENV
          echo "MINECRAFT_IP=$MINECRAFT_IP" >> $GITHUB_ENV
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

          # Salva tunnel.json para o GitHub Pages e Painel conectarem
          cat <<EOF > tunnel.json
{
  "url": "$PANEL_URL",
  "minecraft": "$MINECRAFT_IP",
  "runner_ip": "$RUNNER_IP",
  "direct_ip": "$RUNNER_IP:25565",
  "online": true,
  "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
}
EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tunnel.json 2>/dev/null || true
          git commit -m "🌐 Atualizar link do tunnel HTTPS e Minecraft IP [skip ci]" 2>/dev/null || true
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>&1 || echo "Push de tunnel.json pulado"

          # Exibir no Step Summary do GitHub Actions
          echo "## 🎮 MCForge na Nuvem GitHub Está Online!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ☁️ **Servidor Rodando na Máquina do GitHub (Azure Cloud)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 1. Link do Painel Web (Gerenciamento):" >> $GITHUB_STEP_SUMMARY
          echo "[👉 Clique Aqui para Abrir o Painel Web: **$PANEL_URL**]($PANEL_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🕹️ 2. IP Original da Máquina do GitHub (Minecraft):" >> $GITHUB_STEP_SUMMARY
          echo "\`$RUNNER_IP:25565\` ou \`$MINECRAFT_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PLAYIT_CLAIM" ]; then
            echo "> ⚠️ **Primeira vez usando Playit?** Clique no link para vincular sua conta gratuita e fixar seu IP: [$PLAYIT_CLAIM]($PLAYIT_CLAIM)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "================================================================="
          echo "🎉 SERVIDOR E PAINEL ONLINE NA NUVEM DO GITHUB:"
          echo "👉 Painel Web: $PANEL_URL"
          echo "👉 IP Minecraft: $MINECRAFT_IP"
          echo "================================================================="

      - name: ⏳ Manter Servidor Ativo na Nuvem (Loop com Heartbeat)
        run: |
          DURATION=$(( 5 * 3600 + 20 * 60 )) # 5h20min
          ELAPSED=0

          while [ $ELAPSED -lt $DURATION ]; do
            sleep 180
            ELAPSED=$(( ELAPSED + 180 ))
            REMAINING=$(( (DURATION - ELAPSED) / 60 ))
            echo "[$(date -u +%T)] 🟢 MCForge Cloud Ativo | Site: $PANEL_URL | Restante do ciclo: ${REMAINING}min"
            
            # Checar se o processo do Daemon está vivo
            if ! kill -0 $(cat daemon.pid) 2>/dev/null; then
              echo "⚠️ Daemon parou, reiniciando..."
              cd daemon && npm start >> daemon.log 2>&1 &
              echo $! > ../daemon.pid
              cd ..
            fi
          done

          # Renovação automática para manter 24/7 sem desligar
          echo "🔄 Disparando próximo ciclo contínuo para manter 24/7 ativo..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/minecraft-persistent.yml/dispatches \
            -d '{"ref":"main"}' 2>/dev/null || true

      - name: 💾 Salvar Mundo, Configurações e IP Fixo Playit
        if: always()
        run: |
          echo "Salvando mundos, configurações e IP permanente..."
          mkdir -p backups
          
          # Salva configuração fixa do Playit para o IP nunca mudar
          if [ -d "$HOME/.config/playit" ]; then
            tar -czf backups/playit-saved.tar.gz -C "$HOME/.config/playit" . 2>/dev/null || true
            echo "✓ IP Permanente do Playit preservado!"
          fi

          if [ -d "daemon/servers" ]; then
            tar -czf backups/world-saved.tar.gz -C daemon/servers . 2>/dev/null || true
            echo "✓ Backup do mundo gerado com sucesso!"
          fi

          if [ -d "daemon/data" ]; then
            tar -czf backups/data-saved.tar.gz -C daemon/data . 2>/dev/null || true
            echo "✓ Backup de contas e configurações gerado!"
          fi

      - name: 📤 Commitar e Salvar Progresso no Repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main 2>/dev/null || true
          git add -f backups/*.tar.gz 2>/dev/null || true
          git commit -m "💾 [Auto-Save] Backup do mundo e IP fixo [$(date -u +%Y-%m-%d\ %H:%M)]" 2>/dev/null || echo "Nada novo para commitar"
          git push origin main 2>&1 || echo "Push pulado ou sem alterações."